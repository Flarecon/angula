#--> Gson
spring.mvc.converters.preferred-json-mapper=gson

#--> Conditional Properties
ready.message="Develop it !!!"
reactor.service=true
angula.dynamic.controller=${DYNAMIC_CONTROLLER}

#--> Logging
# levels = trace < debug < info < warn < error < fatal
logging.level.root=warn
logging.level.org.springframework.security=debug

#--> MySql Database
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#--> AWS Configs
cloud.aws.creds.access-key=${IAM_ACCESS_KEY}
cloud.aws.creds.secret-key=${IAM_SECRET_KEY}
cloud.aws.s3.bucket.name=${S3_BUCKET_NAME}
cloud.aws.sqs.url=${SQS_URL}
cloud.aws.sqs.name=${SQS_NAME}

spring.cloud.aws.credentials.access-key=${IAM_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${IAM_SECRET_KEY}
spring.cloud.aws.region.static=${AWS_REGION}