# Application
spring.application.name=angula

# database / DataJpa / Hibernate
spring.datasource.url=jdbc:postgresql://localhost:5432/angula
spring.datasource.username=postgres
spring.datasource.password=aksql
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jta.enabled=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# liquibase
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml


# Gson
spring.mvc.converters.preferred-json-mapper=gson

# Logger
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.structured.format.console=com.example.angula.config.CustomLogger

# Actuator
management.endpoints.web.exposure.include=*

# Devtools
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# Profiles
spring.profiles.active=dev

# Custom Properies
ready.message="Let's Do It !!!"
reactor.service = false
reactor.sweet = yes